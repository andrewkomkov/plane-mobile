---
# Prose wraps at 80 in this repository, but the tables in docs/ are derived
# from route listings and wrapping a cell would make it unreadable.
MD013:
  line_length: 120
  tables: false
  code_blocks: false

# The docs use a single H1 and then descend; duplicate headings inside
# different sections are intentional (every screen has a "What it does").
MD024:
  siblings_only: true

# Compact table pipes — `|---|---|` — throughout. The rule wants padded pipes;
# the tables here are hand-maintained and the padded form makes a wide row
# unreadable in a diff.
MD060: false

# Inline HTML is used sparingly for callouts.
MD033: false

# The first line of CHANGELOG.md is written by release-please.
MD041: false
