plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase Cloud Messaging is optional.
//
// google-services.json names a specific Firebase project, so it is not in the
// repository — see google-services.json.example. Applying the plugin
// unconditionally fails the build outright when the file is absent, which
// would mean nobody could build a clone. Push is the only thing that stops
// working without it: PushNotificationService.initialize already returns
// quietly when Firebase.initializeApp throws.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing material. Never in the repository — key.properties and the
// keystore are both git-ignored. CI writes them from repository secrets; see
// .github/workflows/release.yml.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.slimshaggy.plane_mobile"
    // Compose 1.12 (pulled in by material3 1.5.0-alpha24) requires API 37,
    // above the flutter.compileSdkVersion default.
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xlambdas=class']
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.slimshaggy.plane_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion Math.max(flutter.minSdkVersion, 21)
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // The app updates itself from its GitHub releases, and Android
            // refuses to install a package over one signed with a different
            // key. So a release build must be signed with the *same* key every
            // time, which the debug keystore is not: it is generated per
            // machine, so a CI-built APK signed with it could never install
            // over a locally built one, or over the previous CI build.
            //
            // Fall back to debug signing when no keystore is configured, so a
            // clone with no secrets still builds something runnable — it just
            // cannot receive an update in place.
            signingConfig keystoreProperties.containsKey('storeFile')
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Material 3 Expressive. This is a Jetpack Compose artifact, so it is
    // consumed the only way Flutter can consume Compose: the components below
    // are rendered inside a ComposeView hosted in an Android platform view.
    // See android/app/src/main/kotlin/.../M3ExpressiveViews.kt.
    implementation "androidx.compose.material3:material3:1.5.0-alpha24"
    implementation "androidx.compose.ui:ui:1.12.0-beta01"
    // Tooling for the platform-view host; the ComposeView needs a lifecycle
    // owner, which FlutterFragmentActivity provides.
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.savedstate:savedstate-ktx:1.2.1"
}
