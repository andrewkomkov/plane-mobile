plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.slimshaggy.plane_mobile"
    // Compose 1.12 (pulled in by material3 1.5.0-alpha24) requires API 37,
    // above the flutter.compileSdkVersion default.
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // Kotlin 2.1 crashes lowering Compose's ComposableSingletons holder when
        // it emits lambdas via invokedynamic (LambdaMetafactory). Compiling
        // lambdas as classes is the documented workaround and is what the
        // Compose compiler plugin expects anyway.
        freeCompilerArgs += ['-Xlambdas=class']
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.slimshaggy.plane_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion Math.max(flutter.minSdkVersion, 21)
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Material 3 Expressive. This is a Jetpack Compose artifact, so it is
    // consumed the only way Flutter can consume Compose: the components below
    // are rendered inside a ComposeView hosted in an Android platform view.
    // See android/app/src/main/kotlin/.../M3ExpressiveViews.kt.
    implementation "androidx.compose.material3:material3:1.5.0-alpha24"
    implementation "androidx.compose.ui:ui:1.12.0-beta01"
    // Tooling for the platform-view host; the ComposeView needs a lifecycle
    // owner, which FlutterFragmentActivity provides.
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.savedstate:savedstate-ktx:1.2.1"
}
