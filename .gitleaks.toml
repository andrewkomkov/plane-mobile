# Extends gitleaks' own rules rather than replacing them.
[extend]
useDefault = true

[[allowlists]]
description = """
CocoaPods writes a SHA-1 checksum per pod into Podfile.lock, and gitleaks'
generic-api-key rule matches them on entropy alone. They are integrity hashes
of published open-source pods — public by construction, and regenerated by
`pod install` rather than written by anyone.
"""
paths = ['''ios/Podfile\.lock''']
