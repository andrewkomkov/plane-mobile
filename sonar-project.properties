sonar.projectKey=andrewkomkov_plane-mobile
sonar.organization=andrewkomkov
sonar.projectName=plane-mobile

# The app, the Kotlin that hosts the Compose platform views, and the Python
# tooling. linux/, macos/, windows/ and web/ are unmodified Flutter
# scaffolding, so there is nothing there to hold to a standard.
sonar.sources=lib,tool,android/app/src/main/kotlin
sonar.tests=test,integration_test
sonar.exclusions=**/__pycache__/**

sonar.sourceEncoding=UTF-8

# Written by `flutter test --coverage`, which runs in the same job immediately
# before the scan. Sonar does not measure coverage itself; it only reads the
# report.
sonar.dart.lcov.reportPaths=coverage/lcov.info
