---
name: Feature request
description: Something the app should be able to do and cannot
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        `docs/COVERAGE.md` lists what is covered, partial and missing, measured
        against Plane's own route table. Worth a look first — several gaps are
        already recorded there with the reason.

  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: The task, not the control. "Reassign from the list" rather
        than "add a long-press menu".
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Which Plane endpoint covers it
      description: >
        If you know. `plane/app/urls/` in the Plane source is the authority.
