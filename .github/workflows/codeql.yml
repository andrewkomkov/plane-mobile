name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code without waiting for a
    # push to touch it.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    # CodeQL builds the app before it can extract Kotlin, and then loads
    # eighty query packs. 30 minutes cut it off mid-load.
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      # CodeQL has no Dart support, so this covers the Android sources only —
      # the platform views, the update installer and the install receiver.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - run: |
          flutter pub get
          flutter build apk --debug

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
