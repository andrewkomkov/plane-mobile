name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run still going for the old one.
#
# Every push to main gets a group to itself, keyed on the commit. Keying them
# all on the ref instead put them in one group, and `cancel-in-progress: false`
# does not mean "cancel nothing": a group holds one running run and one pending
# run, and a third arrival cancels the one that was pending. Merging a few pull
# requests in a row was enough to lose the middle run on main — the commit that
# reached the default branch went unverified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube blames findings on the commit that introduced them, and
          # a single-commit checkout leaves it nothing to blame.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # subosito/flutter-action caches the SDK; the package cache is separate
      # and is the one that actually costs time here.
      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Zero findings, not "zero new findings". The tree is clean and stays
      # clean; a warning that is allowed to sit becomes a warning nobody reads.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage --reporter github

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

      # Here rather than in a workflow of its own: the scan wants the LCOV
      # report the test step above just wrote, and a separate workflow would
      # have to run the whole suite again to produce it.
      #
      # A pull request from a fork cannot see SONAR_TOKEN, so the scan would
      # fail rather than be skipped. Contributors do not get a red build for
      # a secret they were never going to have.
      - name: SonarQube Scan
        if: github.event.pull_request.head.repo.fork != true
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      # Debug rather than release: this job proves the Android build compiles
      # on every pull request, and a debug build needs no signing secrets, so
      # it works on a fork. The signed release APK is built in release.yml.
      - name: Build APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - run: flutter pub get

      # No code signing: this proves the iOS target still compiles, which is
      # the claim the README makes about it and nothing more.
      - name: Build iOS
        run: flutter build ios --no-codesign --debug
