# Applied on top of detekt's defaults (--build-upon-default-config), so only
# the deviations are here.
#
# Every entry below is a rule that fights a convention this project does not
# get to choose: Flutter generates the package name, Compose names its
# components, and a platform view is mostly dimensions.

naming:
  FunctionNaming:
    # Compose components are PascalCase by convention, and the platform views
    # in M3ExpressiveViews.kt are composables.
    ignoreAnnotated: ['Composable']
  PackageNaming:
    # `com.slimshaggy.plane_mobile` — the underscore comes from the Flutter
    # project name and has to match the Android applicationId, so it is not
    # ours to rename.
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'

style:
  MagicNumber:
    # The Compose interop layer is dimensions, durations and alpha values.
    # Naming each one would add a constant per line and say nothing.
    excludes: ['**/M3ExpressiveViews.kt']
  MaxLineLength:
    maxLineLength: 120

empty-blocks:
  EmptyFunctionBlock:
    # An interface method deliberately left empty is the point of several
    # platform-view overrides; detekt cannot tell that from an oversight.
    ignoreOverridden: true
